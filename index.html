<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RelayHub</title>
<style>
* {
    box-sizing: border-box;
}
html, body {
    height: 100%;
    margin: 0;
}
body {
    background: #0c0d0f;
    color: #e5e7eb;
    font: 14px Inter, system-ui, sans-serif;
    overflow: hidden;
}
button, input, select, textarea {
    font: inherit;
    color: inherit;
}
button {
    cursor: pointer;
}
.app {
    height: 100vh;
    display: flex;
    flex-direction: column;
}
.top {
    height: 74px;
    padding: 14px;
    border-bottom: 1px solid #292d35;
    display: flex;
    align-items: center;
    gap: 10px;
}
.logo {
    width: 100px;
    font-size: 20px;
    font-weight: 700;
    color: #fff;
    letter-spacing: -.5px;
}
.top select, .top input, .top button {
    height: 43px;
    border: 1px solid #292d35;
    background: #1b1e24;
    border-radius: 9px;
}
.top select {
    width: 110px;
    padding: 0 14px;
    font-weight: 600;
}
.top input {
    flex: 1;
    padding: 0 16px;
    color: #91a3c5;
    outline: none;
}
.top input:focus {
    border-color: #5875bd;
}
.top button {
    padding: 0 22px;
    font-weight: 600;
}
.send {
    background: #6688ff !important;
    border-color: #6688ff !important;
    color: white;
}
.send:hover {
    background: #5879ed !important;
}
.save {
    background: #20242d !important;
    color: #9bb1d8;
}
.save:hover {
    background: #292e3a !important;
}
.account {
    max-width: 220px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    color: #91a3c5;
}
.auth {
    height: 100vh;
    display: grid;
    place-items: center;
    padding: 20px;
}
.auth-panel {
    width: min(420px, 100%);
    border: 1px solid #292d35;
    background: #101216;
    border-radius: 8px;
    padding: 22px;
}
.auth-brand {
    margin-bottom: 18px;
    font-size: 26px;
    font-weight: 750;
    color: #fff;
}
.auth-tabs {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
    margin-bottom: 14px;
}
.auth-panel input {
    width: 100%;
    height: 44px;
    margin-bottom: 10px;
    border: 1px solid #292d35;
    background: #1b1e24;
    border-radius: 8px;
    padding: 0 13px;
    outline: none;
}
.auth-panel input:focus {
    border-color: #5875bd;
}
.auth-panel .send {
    width: 100%;
    height: 44px;
    border-radius: 8px;
    border: 1px solid #6688ff;
}
.auth-error {
    min-height: 20px;
    margin-top: 10px;
    color: #ef7777;
}
.workspace {
    flex: 1;
    display: grid;
    grid-template-columns: 280px 1fr 1fr;
    min-height: 0;
}
.pane {
    min-width: 0;
    display: flex;
    flex-direction: column;
}
.left {
    border-right: 1px solid #292d35;
}
.sidebar {
    border-right: 1px solid #292d35;
    background: #101216;
}
.sidebar-section {
    min-height: 0;
    display: flex;
    flex-direction: column;
}
.sidebar-section:first-child {
    height: 48%;
    border-bottom: 1px solid #292d35;
}
.sidebar-actions {
    display: flex;
    gap: 8px;
}
.icon-btn {
    height: 32px;
    min-width: 32px;
    border: 1px solid #292d35;
    background: #1b1e24;
    border-radius: 7px;
    color: #9bb1d8;
}
.sidebar-list {
    flex: 1;
    min-height: 0;
    overflow: auto;
    padding: 8px;
}
.list-item {
    width: 100%;
    border: 0;
    background: transparent;
    color: #cbd5e1;
    padding: 10px;
    border-radius: 7px;
    text-align: left;
}
.list-item:hover {
    background: #1b1e24;
}
.item-title {
    display: flex;
    align-items: center;
    gap: 8px;
    min-width: 0;
    font-weight: 650;
}
.method-chip {
    flex: 0 0 auto;
    min-width: 48px;
    color: #78a0ff;
    font-size: 11px;
    letter-spacing: .04em;
}
.item-name, .item-url {
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
}
.item-url {
    margin-top: 4px;
    color: #667085;
    font-size: 12px;
}
.sidebar-empty {
    padding: 18px 10px;
    color: #63708a;
    font-size: 13px;
}
.pane-head {
    height: 60px;
    padding: 0 14px;
    border-bottom: 1px solid #292d35;
    display: flex;
    align-items: center;
    justify-content: space-between;
    color: #8ea3c7;
    font-size: 13px;
    font-weight: 600;
    letter-spacing: .04em;
}
.tabs {
    display: flex;
    gap: 4px;
}
.tab {
    border: 0;
    background: transparent;
    padding: 9px 14px;
    border-radius: 7px;
    color: #667085;
}
.tab:hover {
    color: #a5b4d0;
}
.tab.active {
    background: #202531;
    color: #78a0ff;
}
.content {
    flex: 1;
    min-height: 0;
    overflow: auto;
    padding: 14px;
}
.headers {
    display: flex;
    flex-direction: column;
    gap: 8px;
}
.header-row {
    display: flex;
    gap: 7px;
}
.header-row input {
    flex: 1;
    min-width: 0;
    background: #191c22;
    border: 1px solid #30343d;
    border-radius: 7px;
    padding: 10px 12px;
    outline: none;
}
.header-row input:focus {
    border-color: #5875bd;
}
.remove {
    border: 0;
    background: transparent;
    color: #7182a4;
    font-size: 12px;
}
.remove:hover {
    color: #ef7777;
}
.add {
    margin-top: auto;
    border: 0;
    background: #20242d;
    border-radius: 8px;
    padding: 10px 14px;
    color: #9bb1d8;
}
.add:hover {
    background: #292e3a;
}

.request-body {
    height: 100%;
    display: flex;
}
.request-body textarea {
    width: 100%;
    height: 100%;
    min-height: 200px;
    resize: none;
    background: #101216;
    border: 1px solid #292d35;
    border-radius: 8px;
    padding: 15px;
    outline: none;
    font: 13px/1.6 ui-monospace, SFMono-Regular, monospace;
    color: #cbd5e1;
}
.response-meta {
    height: 38px;
    padding: 0 14px;
    display: flex;
    align-items: center;
    gap: 20px;
    border-bottom: 1px solid #20232a;
    color: #727d91;
    font-size: 12px;
}
.ok {
    color: #69c99a;
}
.response-content {
    flex: 1;
    min-height: 0;
    overflow: auto;
    padding: 14px;
}
.response-content pre {
    margin: 0;
    min-height: 100%;
    white-space: pre-wrap;
    word-break: break-word;
    font: 13px/1.6 ui-monospace, SFMono-Regular, monospace;
    color: #cbd5e1;
}
.empty {
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    color: #63708a;
    gap: 12px;
}
.empty-icon {
    font-size: 40px;
    opacity: .5;
}
.hidden {
    display: none !important;
}
@media (max-width: 800px) {
    .workspace {
        grid-template-columns: 1fr;
    }
    .sidebar {
        height: 260px;
        border-right: 0;
        border-bottom: 1px solid #292d35;
    }
    .left {
        display: none;
    }
    .logo {
        width: auto;
    }
}
</style>
</head>
<body>
<div id="authView" class="auth">
    <form class="auth-panel" onsubmit="submitAuth(event)">
        <div class="auth-brand">RelayHub</div>
        <div class="auth-tabs">
            <button id="loginTab" type="button" class="tab active" onclick="setAuthMode('login')">Login</button>
            <button id="registerTab" type="button" class="tab" onclick="setAuthMode('register')">Register</button>
        </div>
        <input id="authEmail" type="email" autocomplete="email" placeholder="Email" required>
        <input id="authPassword" type="password" autocomplete="current-password" placeholder="Password" required>
        <button id="authSubmit" class="send" type="submit">Login</button>
        <div id="authError" class="auth-error"></div>
    </form>
</div>
<div id="appView" class="app hidden">
    <div class="top">
        <div class="logo">RelayHub</div>
        <select id="method">
            <option>GET</option>
            <option>POST</option>
            <option>PUT</option>
            <option>PATCH</option>
            <option>DELETE</option>
        </select>
        <input id="url" value="" placeholder="Enter request URL...">
        <button class="save" onclick="saveRequest()">Save</button>
        <button class="send" onclick="sendRequest()">Send</button>
        <span id="accountEmail" class="account"></span>
        <button class="save" onclick="logout()">Logout</button>
    </div>
    <div class="workspace">
        <aside class="pane sidebar">
            <section class="sidebar-section">
                <div class="pane-head">
                    <span>SAVED</span>
                    <div class="sidebar-actions">
                        <button class="icon-btn" onclick="createCollection()" title="New collection">+</button>
                        <button class="icon-btn" onclick="loadData()" title="Refresh">↻</button>
                    </div>
                </div>
                <div id="savedList" class="sidebar-list"></div>
            </section>
            <section class="sidebar-section">
                <div class="pane-head">
                    <span>HISTORY</span>
                    <button class="icon-btn" onclick="clearHistory()" title="Clear history">×</button>
                </div>
                <div id="historyList" class="sidebar-list"></div>
            </section>
        </aside>
        <section class="pane left">
            <div class="pane-head">
                <span>REQUEST</span>
                <div class="tabs">
                    <button class="tab active" onclick="requestTab('headers', this)" >Headers</button>
                    <button class="tab" onclick="requestTab('body', this)" >Body</button>
                </div>
            </div>
            <div id="requestHeaders" class="content" style="display:flex;flex-direction:column" >
                <div id="headerList" class="headers"></div>
                <button class="add" onclick="addHeader()">Add Header</button>
            </div>
            <div id="requestBody" class="content hidden request-body">
                <textarea id="body" placeholder='{"key":"value"}' ></textarea>
            </div>
        </section>
        <section class="pane response">
            <div class="pane-head">
                <span>RESPONSE</span>
                <span id="responseStatus"></span>
            </div>
            <div class="pane-head" style="height:48px;justify-content:flex-start" >
                <div class="tabs">
                    <button class="tab active" onclick="responseTab('body', this)" >Body</button>
                    <button class="tab" onclick="responseTab('headers', this)" >Headers</button>
                </div>
            </div>
            <div id="empty" class="empty">
                <div>Send a request to see the response</div>
                <small>Ctrl + Enter to send</small>
            </div>
            <div id="responseBody" class="response-content hidden">
                <pre id="output"></pre>
            </div>
            <div id="responseHeaders" class="response-content hidden">
                <pre id="outputHeaders"></pre>
            </div>
        </section>
    </div>
</div>
<script>
const $ = id => document.getElementById(id);
const escapeHTML = value => String(value ?? "").replace(/[&<>"']/g, char => ({
    "&": "&amp;",
    "<": "&lt;",
    ">": "&gt;",
    '"': "&quot;",
    "'": "&#39;"
}[char]));
const tokenKey = "relayhub:token";
const accountKey = "relayhub:account";
let authMode = "login";
let currentAccount = null;
function authToken() {
    return localStorage.getItem(tokenKey) || "";
}
function apiFetch(url, options = {}) {
    const token = authToken();
    if (!token) {
        showAuth();
        throw new Error("Login first");
    }
    return fetch(url, {
        ...options,
        headers: {
            ...(options.headers || {}),
            "Authorization": `Bearer ${token}`
        }
    });
}
function setAuthMode(mode) {
    authMode = mode;
    $("loginTab").classList.toggle("active", mode === "login");
    $("registerTab").classList.toggle("active", mode === "register");
    $("authSubmit").textContent = mode === "login" ? "Login" : "Create account";
    $("authPassword").autocomplete = mode === "login" ? "current-password" : "new-password";
    $("authError").textContent = "";
}
function showAuth(message = "") {
    $("authView").classList.remove("hidden");
    $("appView").classList.add("hidden");
    $("authError").textContent = message;
}
function showApp(user) {
    currentAccount = user;
    localStorage.setItem(accountKey, JSON.stringify(user));
    $("accountEmail").textContent = user.email;
    $("authView").classList.add("hidden");
    $("appView").classList.remove("hidden");
    loadData();
}
async function submitAuth(event) {
    event.preventDefault();
    $("authError").textContent = "";
    const email = $("authEmail").value.trim().toLowerCase();
    const password = $("authPassword").value;
    const endpoint = authMode === "login" ? "/api/auth/login" : "/api/auth/register";
    try {
        const response = await fetch(endpoint, {
            method: "POST",
            headers: {"Content-Type": "application/json"},
            body: JSON.stringify({email, password})
        });
        const data = await response.json();
        if (!response.ok) {
            throw new Error(data.message || "Authentication failed");
        }
        localStorage.setItem(tokenKey, data.token);
        showApp(data.user);
    } catch (error) {
        $("authError").textContent = error.message;
    }
}
async function restoreSession() {
    const token = authToken();
    if (!token) {
        showAuth();
        return;
    }
    try {
        const response = await apiFetch("/api/auth/me");
        const data = await response.json();
        if (!response.ok) {
            throw new Error(data.message || "Session expired");
        }
        showApp(data.user);
    } catch (error) {
        localStorage.removeItem(tokenKey);
        localStorage.removeItem(accountKey);
        showAuth(error.message);
    }
}
async function logout() {
    try {
        if (authToken()) {
            await apiFetch("/api/auth/logout", {method: "POST"});
        }
    } finally {
        localStorage.removeItem(tokenKey);
        localStorage.removeItem(accountKey);
        currentAccount = null;
        showAuth();
    }
}
function addHeader(key = "", value = "") {
    const row = document.createElement("div");
    row.className = "header-row";
    row.innerHTML = `
        <input class="hk" placeholder="Header name" value="${escapeHTML(key)}">
        <input class="hv" placeholder="Value" value="${escapeHTML(value)}">
        <button class="remove" onclick="this.parentElement.remove()">Remove</button>
    `;
    $("headerList").appendChild(row);
}
addHeader();
function requestTab(tab, btn) {
    $("requestHeaders").classList.toggle("hidden", tab !== "headers");
    $("requestBody").classList.toggle("hidden", tab !== "body");
    document.querySelectorAll(".left .tab").forEach(x => x.classList.remove("active"));
    btn.classList.add("active");
}
function responseTab(tab, btn) {
    $("responseBody").classList.toggle("hidden", tab !== "body");
    $("responseHeaders").classList.toggle("hidden", tab !== "headers");
    document.querySelectorAll(".response .tab").forEach(x => x.classList.remove("active"));
    btn.classList.add("active");
}
function collectRequest() {
    const method = $("method").value;
    const url = $("url").value.trim();
    const body = $("body").value;
    const headers = {};
    document.querySelectorAll(".header-row").forEach(row => {
        const key = row.querySelector(".hk").value.trim();
        const value = row.querySelector(".hv").value;
        if (key) {
            headers[key] = value;
        }
    });
    return {method, url, headers, body};
}
function applyRequest(request) {
    $("method").value = request.method || "GET";
    $("url").value = request.url || "";
    $("body").value = request.body || request.request_body || "";
    $("headerList").innerHTML = "";
    const headers = request.headers || {};
    const entries = Object.entries(headers);
    if (!entries.length) {
        addHeader();
        return;
    }
    entries.forEach(([key, value]) => addHeader(key, value));
}
async function loadData() {
    await Promise.all([loadSavedRequests(), loadHistory()]);
}
async function loadSavedRequests() {
    const list = $("savedList");
    list.innerHTML = `<div class="sidebar-empty">Loading saved requests...</div>`;
    try {
        const response = await apiFetch("/api/saved-requests");
        const data = await response.json();
        const requests = data.requests || [];
        if (!requests.length) {
            list.innerHTML = `<div class="sidebar-empty">No saved requests yet</div>`;
            return;
        }
        list.innerHTML = requests.map(request => `
            <button class="list-item" onclick='applyRequest(${escapeHTML(JSON.stringify(request))})'>
                <div class="item-title">
                    <span class="method-chip">${escapeHTML(request.method)}</span>
                    <span class="item-name">${escapeHTML(request.name)}</span>
                </div>
                <div class="item-url">${escapeHTML(request.url)}</div>
            </button>
        `).join("");
    } catch (error) {
        list.innerHTML = `<div class="sidebar-empty">${escapeHTML(error.message)}</div>`;
    }
}
async function loadHistory() {
    const list = $("historyList");
    list.innerHTML = `<div class="sidebar-empty">Loading history...</div>`;
    try {
        const response = await apiFetch("/api/history?limit=30");
        const data = await response.json();
        const history = data.history || [];
        if (!history.length) {
            list.innerHTML = `<div class="sidebar-empty">No requests sent yet</div>`;
            return;
        }
        list.innerHTML = history.map(entry => `
            <button class="list-item" onclick='applyRequest(${escapeHTML(JSON.stringify(entry))})'>
                <div class="item-title">
                    <span class="method-chip">${escapeHTML(entry.method)}</span>
                    <span class="item-name">${entry.error ? "Error" : escapeHTML(entry.status_code)}</span>
                </div>
                <div class="item-url">${escapeHTML(entry.url)}</div>
            </button>
        `).join("");
    } catch (error) {
        list.innerHTML = `<div class="sidebar-empty">${escapeHTML(error.message)}</div>`;
    }
}

async function saveRequest() {
    const request = collectRequest();
    if (!request.url) {
        $("responseStatus").textContent = "Enter a URL";
        return;
    }
    const fallbackName = `${request.method} ${request.url}`;
    const name = prompt("Save request as", fallbackName);
    if (!name) return;
    try {
        const response = await apiFetch("/api/saved-requests", {
            method: "POST",
            headers: {"Content-Type": "application/json"},
            body: JSON.stringify({...request, name})
        });
        const data = await response.json();
        if (!response.ok) {
            throw new Error(data.message || "Failed to save request");
        }
        $("responseStatus").innerHTML = `<span class="ok">Saved</span>`;
        await loadSavedRequests();
    } catch (error) {
        $("responseStatus").innerHTML = `<span style='color:#ef7777'>${escapeHTML(error.message)}</span>`;
    }
}

async function createCollection() {
    const name = prompt("Collection name");
    if (!name) return;
    try {
        const response = await apiFetch("/api/collections", {
            method: "POST",
            headers: {"Content-Type": "application/json"},
            body: JSON.stringify({name})
        });
        const data = await response.json();
        if (!response.ok) {
            throw new Error(data.message || "Failed to create collection");
        }
        $("responseStatus").innerHTML = `<span class="ok">Collection created</span>`;
    } catch (error) {
        $("responseStatus").innerHTML = `<span style='color:#ef7777'>${escapeHTML(error.message)}</span>`;
    }
}

async function clearHistory() {
    try {
        const response = await apiFetch("/api/history", {method: "DELETE"});
        const data = await response.json();
        if (!response.ok) {
            throw new Error(data.message || "Failed to clear history");
        }
        await loadHistory();
    } catch (error) {
        $("responseStatus").innerHTML = `<span style='color:#ef7777'>${escapeHTML(error.message)}</span>`;
    }
}
async function sendRequest() {
    const {method, url, headers, body} = collectRequest();
    if (!url) {
        $("responseStatus").textContent = "Enter a URL";
        return;
    }
    $("empty").classList.add("hidden");
    $("responseBody").classList.remove("hidden");
    $("output").textContent = "Sending...";
    $("responseStatus").textContent = "";
    try {
        const response = await apiFetch("/api/request", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({method,url,headers,body})
        });
        const data = await response.json();
        $("output").textContent = data.body || data.message || "";
        $("outputHeaders").textContent =data.headers? Object.entries(data.headers).map(([key, value]) => `${key}: ${value}`).join("\n"): "";
        $("responseStatus").innerHTML =data.error? "<span style='color:#ef7777'>Error</span>" : `<span class="ok">${data.status_code} ${data.status_text}</span> · ${data.elapsed_ms ?? "-"} ms`;
        await loadHistory();
    } catch (error) {
        $("output").textContent = error.message;
        $("responseStatus").innerHTML = "<span style='color:#ef7777'>Connection Error</span>";
    }
}
document.addEventListener("keydown", event => {
    if ((event.ctrlKey || event.metaKey) && event.key === "Enter") sendRequest();
});
restoreSession();
</script>
</body>
</html>
