<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RelayHub</title>
<style>
* {
    box-sizing: border-box;
}
html, body {
    height: 100%;
    margin: 0;
}
body {
    background: #0c0d0f;
    color: #e5e7eb;
    font: 14px Inter, system-ui, sans-serif;
    overflow: hidden;
}
button, input, select, textarea {
    font: inherit;
    color: inherit;
}
button {
    cursor: pointer;
}
.app {
    height: 100vh;
    display: flex;
    flex-direction: column;
}
.top {
    height: 74px;
    padding: 14px;
    border-bottom: 1px solid #292d35;
    display: flex;
    align-items: center;
    gap: 10px;
}
.logo {
    width: 100px;
    font-size: 20px;
    font-weight: 700;
    color: #fff;
    letter-spacing: -.5px;
}
.top select, .top input, .top button {
    height: 43px;
    border: 1px solid #292d35;
    background: #1b1e24;
    border-radius: 9px;
}
.top select {
    width: 110px;
    padding: 0 14px;
    font-weight: 600;
}
.top input {
    flex: 1;
    padding: 0 16px;
    color: #91a3c5;
    outline: none;
}
.top input:focus {
    border-color: #5875bd;
}
.top button {
    padding: 0 22px;
    font-weight: 600;
}
.send {
    background: #6688ff !important;
    border-color: #6688ff !important;
    color: white;
}
.send:hover {
    background: #5879ed !important;
}
.workspace {
    flex: 1;
    display: grid;
    grid-template-columns: 1fr 1fr;
    min-height: 0;
}
.pane {
    min-width: 0;
    display: flex;
    flex-direction: column;
}
.left {
    border-right: 1px solid #292d35;
}
.pane-head {
    height: 60px;
    padding: 0 14px;
    border-bottom: 1px solid #292d35;
    display: flex;
    align-items: center;
    justify-content: space-between;
    color: #8ea3c7;
    font-size: 13px;
    font-weight: 600;
    letter-spacing: .04em;
}
.tabs {
    display: flex;
    gap: 4px;
}
.tab {
    border: 0;
    background: transparent;
    padding: 9px 14px;
    border-radius: 7px;
    color: #667085;
}
.tab:hover {
    color: #a5b4d0;
}
.tab.active {
    background: #202531;
    color: #78a0ff;
}
.content {
    flex: 1;
    min-height: 0;
    overflow: auto;
    padding: 14px;
}
.headers {
    display: flex;
    flex-direction: column;
    gap: 8px;
}
.header-row {
    display: flex;
    gap: 7px;
}
.header-row input {
    flex: 1;
    min-width: 0;
    background: #191c22;
    border: 1px solid #30343d;
    border-radius: 7px;
    padding: 10px 12px;
    outline: none;
}
.header-row input:focus {
    border-color: #5875bd;
}
.remove {
    border: 0;
    background: transparent;
    color: #7182a4;
    font-size: 12px;
}
.remove:hover {
    color: #ef7777;
}
.add {
    margin-top: auto;
    border: 0;
    background: #20242d;
    border-radius: 8px;
    padding: 10px 14px;
    color: #9bb1d8;
}
.add:hover {
    background: #292e3a;
}

.request-body {
    height: 100%;
    display: flex;
}
.request-body textarea {
    width: 100%;
    height: 100%;
    min-height: 200px;
    resize: none;
    background: #101216;
    border: 1px solid #292d35;
    border-radius: 8px;
    padding: 15px;
    outline: none;
    font: 13px/1.6 ui-monospace, SFMono-Regular, monospace;
    color: #cbd5e1;
}
.response-meta {
    height: 38px;
    padding: 0 14px;
    display: flex;
    align-items: center;
    gap: 20px;
    border-bottom: 1px solid #20232a;
    color: #727d91;
    font-size: 12px;
}
.ok {
    color: #69c99a;
}
.response-content {
    flex: 1;
    min-height: 0;
    overflow: auto;
    padding: 14px;
}
.response-content pre {
    margin: 0;
    min-height: 100%;
    white-space: pre-wrap;
    word-break: break-word;
    font: 13px/1.6 ui-monospace, SFMono-Regular, monospace;
    color: #cbd5e1;
}
.empty {
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    color: #63708a;
    gap: 12px;
}
.empty-icon {
    font-size: 40px;
    opacity: .5;
}
.hidden {
    display: none !important;
}
@media (max-width: 800px) {
    .workspace {
        grid-template-columns: 1fr;
    }
    .left {
        display: none;
    }
    .logo {
        width: auto;
    }
}
</style>
</head>
<body>
<div class="app">
    <div class="top">
        <div class="logo">RelayHub</div>
        <select id="method">
            <option>GET</option>
            <option>POST</option>
            <option>PUT</option>
            <option>PATCH</option>
            <option>DELETE</option>
        </select>
        <input id="url" value="" placeholder="Enter request URL...">
        <button class="send" onclick="sendRequest()">Send</button>
    </div>
    <div class="workspace">
        <section class="pane left">
            <div class="pane-head">
                <span>REQUEST</span>
                <div class="tabs">
                    <button class="tab active" onclick="requestTab('headers', this)" >Headers</button>
                    <button class="tab" onclick="requestTab('body', this)" >Body</button>
                </div>
            </div>
            <div id="requestHeaders" class="content" style="display:flex;flex-direction:column" >
                <div id="headerList" class="headers"></div>
                <button class="add" onclick="addHeader()">Add Header</button>
            </div>
            <div id="requestBody" class="content hidden request-body">
                <textarea id="body" placeholder='{"key":"value"}' ></textarea>
            </div>
        </section>
        <section class="pane response">
            <div class="pane-head">
                <span>RESPONSE</span>
                <span id="responseStatus"></span>
            </div>
            <div class="pane-head" style="height:48px;justify-content:flex-start" >
                <div class="tabs">
                    <button class="tab active" onclick="responseTab('body', this)" >Body</button>
                    <button class="tab" onclick="responseTab('headers', this)" >Headers</button>
                </div>
            </div>
            <div id="empty" class="empty">
                <div>Send a request to see the response</div>
                <small>Ctrl + Enter to send</small>
            </div>
            <div id="responseBody" class="response-content hidden">
                <pre id="output"></pre>
            </div>
            <div id="responseHeaders" class="response-content hidden">
                <pre id="outputHeaders"></pre>
            </div>
        </section>
    </div>
</div>
<script>
const $ = id => document.getElementById(id);
function addHeader(key = "", value = "") {
    const row = document.createElement("div");
    row.className = "header-row";
    row.innerHTML = `
        <input class="hk" placeholder="Header name" value="${key}">
        <input class="hv" placeholder="Value" value="${value}">
        <button class="remove" onclick="this.parentElement.remove()">Remove</button>
    `;
    $("headerList").appendChild(row);
}
addHeader();
function requestTab(tab, btn) {
    $("requestHeaders").classList.toggle("hidden", tab !== "headers");
    $("requestBody").classList.toggle("hidden", tab !== "body");
    document.querySelectorAll(".left .tab").forEach(x => x.classList.remove("active"));
    btn.classList.add("active");
}
function responseTab(tab, btn) {
    $("responseBody").classList.toggle("hidden", tab !== "body");
    $("responseHeaders").classList.toggle("hidden", tab !== "headers");
    document.querySelectorAll(".response .tab").forEach(x => x.classList.remove("active"));
    btn.classList.add("active");
}
async function sendRequest() {
    const method = $("method").value;
    const url = $("url").value.trim();
    const body = $("body").value;
    const headers = {};
    document.querySelectorAll(".header-row").forEach(row => {
        const key = row.querySelector(".hk").value.trim();
        const value = row.querySelector(".hv").value;
        if (key) {
            headers[key] = value;
        }
    });
    if (!url) {
        $("responseStatus").textContent = "Enter a URL";
        return;
    }
    $("empty").classList.add("hidden");
    $("responseBody").classList.remove("hidden");
    $("output").textContent = "Sending...";
    $("responseStatus").textContent = "";
    try {
        const response = await fetch("/api/request", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({method,url,headers,body})
        });
        const data = await response.json();
        $("output").textContent = data.body || data.message || "";
        $("outputHeaders").textContent =data.headers? Object.entries(data.headers).map(([key, value]) => `${key}: ${value}`).join("\n"): "";
        $("responseStatus").innerHTML =data.error? "<span style='color:#ef7777'>Error</span>" : `<span class="ok">${data.status_code} ${data.status_text}</span> · ${data.elapsed_ms ?? "-"} ms`;
    } catch (error) {
        $("output").textContent = error.message;
        $("responseStatus").innerHTML = "<span style='color:#ef7777'>Connection Error</span>";
    }
}
document.addEventListener("keydown", event => {
    if ((event.ctrlKey || event.metaKey) && event.key === "Enter") sendRequest();
});
</script>
</body>
</html>
